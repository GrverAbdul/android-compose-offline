
name: Descargar WebCode en espanol

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  descargar:
    name: Descargar documentacion WebCode
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Instalar HTTrack
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y httrack
          httrack --version

      - name: Preparar carpetas
        shell: bash
        run: |
          mkdir -p webcode-offline

      - name: Comprobar acceso al sitio
        shell: bash
        run: |
          URL="https://webcode.net.pe/web/index.html"

          echo "Comprobando acceso..."

          curl -sS -L \
            --max-redirs 10 \
            -o pagina-prueba.html \
            -w "\nHTTP final: %{http_code}\nURL final: %{url_effective}\nTipo de contenido: %{content_type}\n" \
            "$URL"

          if ! grep -qiE '<html|<!doctype html' pagina-prueba.html; then
            echo "ERROR: No se recibio HTML."
            exit 1
          fi

          echo "Acceso correcto."

      - name: Descargar sitio con HTTrack
        shell: bash
        timeout-minutes: 165
        run: |
          URL="https://webcode.net.pe/web/index.html"
          OUTPUT="webcode-offline"

          set -o pipefail

          httrack "$URL" \
            -O "$OUTPUT" \
            --stay-on-same-address \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/139.0.0.0 Safari/537.36" \
            --verbose \
            --file-log \
            --extra-log \
            -r5 \
            2>&1 | tee httrack-console.log

      - name: Analizar descarga
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter

          folder = Path("webcode-offline")

          files = [p for p in folder.rglob("*") if p.is_file()]
          counts = Counter(p.suffix.lower() for p in files)
          total_size = sum(p.stat().st_size for p in files)

          extensions = [
              ".html", ".htm", ".css", ".js",
              ".png", ".jpg", ".jpeg", ".webp",
              ".gif", ".svg", ".ico",
              ".woff", ".woff2", ".ttf", ".otf",
              ".json", ".xml", ".pdf"
          ]

          lines = [
              "INFORME DE DESCARGA WEBCODE",
              "",
              f"Total de archivos: {len(files)}",
              f"Tamano total: {total_size / (1024 * 1024):.2f} MB",
              "",
              "RECURSOS POR EXTENSION:"
          ]

          for ext in extensions:
              lines.append(f"{ext}: {counts[ext]}")

          lines.extend([
              "",
              f"HTML total: {counts['.html'] + counts['.htm']}",
              f"CSS total: {counts['.css']}",
              f"JavaScript total: {counts['.js']}"
          ])

          report = "\n".join(lines)
          Path("informe-recursos.txt").write_text(report, encoding="utf-8")
          print(report)
          PY

      - name: Guardar descarga
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: WebCode-Documentacion
          path: |
            webcode-offline/
            httrack-console.log
            informe-recursos.txt
            pagina-prueba.html
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
