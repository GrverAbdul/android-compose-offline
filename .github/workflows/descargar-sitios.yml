
name: Descargar documentación offline

on:
  workflow_dispatch:
    inputs:
      restore_run_id:
        description: "ID de la ejecución anterior para recuperar el artefacto"
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recuperar descarga anterior
        if: ${{ inputs.restore_run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: Documentacion-WebCode-Pensa-JavierCarrasco
          run-id: ${{ inputs.restore_run_id }}
          github-token: ${{ github.token }}
          path: .

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4

      - name: Instalar Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Descargar y procesar documentación
        run: |
          python descargar_sitios.py

      - name: Mostrar informe
        if: always()
        run: |
          echo "========== INFORME =========="

          if [ -f informe-descarga.json ]; then
            cat informe-descarga.json
          else
            echo "No se generó el informe."
          fi

          echo "========== ERRORES =========="

          if [ -f errores-descarga.txt ]; then
            cat errores-descarga.txt
          else
            echo "No se generó el archivo de errores."
          fi

      - name: Subir documentación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Documentacion-WebCode-Pensa-JavierCarrasco
          path: |
            salida/
            informe-descarga.json
            errores-descarga.txt
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
          
