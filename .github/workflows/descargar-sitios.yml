name: Descargar documentacion offline con Chromium

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar Playwright y Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4
          python -m playwright install --with-deps chromium

      - name: Descargar los tres sitios
        timeout-minutes: 330
        run: python descargar_sitios.py

      - name: Comprimir y guardar resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Documentacion-WebCode-Pensa-JavierCarrasco
          path: |
            salida/
            informe-descarga.json
            errores-descarga.txt
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
