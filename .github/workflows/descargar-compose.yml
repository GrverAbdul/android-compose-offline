
name: Descargar Android UI en espanol

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  descargar:
    name: Descargar documentacion Android UI
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      # 1. Descargar instalador oficial
      - name: Descargar instalador oficial de Cyotek WebCopy
        shell: pwsh
        timeout-minutes: 5
        run: |
          $url = "https://www.cyotek.com/downloads/get/setup-cyowcopy-1.9.1.872-x64.exe"
          $installer = "$env:RUNNER_TEMP\cyotek-webcopy.exe"

          Invoke-WebRequest -Uri $url -OutFile $installer

          $expected = "8b5dfdce50f95a26dea849aacc355efae459cbb2360de19fcf1a33b266f8cce0"
          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()

          if ($actual -ne $expected) {
            throw "El SHA256 del instalador no coincide."
          }

          Write-Host "Instalador verificado."

      # 2. Instalar WebCopy
      - name: Instalar Cyotek WebCopy
        shell: pwsh
        timeout-minutes: 5
        run: |
          $installer = "$env:RUNNER_TEMP\cyotek-webcopy.exe"
          $installDir = "C:\Cyotek\WebCopy"
          $installLog = "$env:RUNNER_TEMP\cyotek-install.log"

          $arguments = @(
            "/VERYSILENT"
            "/SUPPRESSMSGBOXES"
            "/NORESTART"
            "/SP-"
            "/DIR=$installDir"
            "/LOG=$installLog"
          )

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList $arguments `
            -PassThru

          if (-not $process.WaitForExit(180000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Tiempo de instalacion agotado."
          }

          if ($process.ExitCode -ne 0) {
            Get-Content $installLog -Tail 40
            throw "Error instalando WebCopy."
          }

          $wcopy = Join-Path $installDir "wcopy.exe"

          if (-not (Test-Path $wcopy)) {
            throw "No se encontro wcopy.exe."
          }

          "WCOPY_PATH=$wcopy" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Instalacion correcta."

      # 3. Preparar carpetas
      - name: Preparar carpetas
        shell: pwsh
        run: |
          $output = "$env:GITHUB_WORKSPACE\android-ui-es"

          New-Item -ItemType Directory -Path $output -Force |
            Out-Null

          Write-Host "Carpeta preparada."

      # 4. Descargar documentación
      - name: Descargar documentacion Android UI
        id: download
        shell: pwsh
        timeout-minutes: 300
        run: |
          $url = "https://developer.android.com/develop/ui?hl=es"
          $output = "$env:GITHUB_WORKSPACE\android-ui-es"
          $log = "$env:GITHUB_WORKSPACE\webcopy.log"

          Write-Host "URL inicial: $url"
          Write-Host "Modo: Domain"
          Write-Host "Descarga recursiva activada."

          & "$env:WCOPY_PATH" `
            $url `
            /mode Domain `
            /recursive `
            /o $output `
            /LOG $log `
            /STATISTICS

          $exitCode = $LASTEXITCODE

          Write-Host "Codigo de salida: $exitCode"

          "Codigo de salida: $exitCode" |
            Out-File "$output\resultado.txt"

          if ($exitCode -ne 0) {
            throw "WebCopy finalizo con error $exitCode."
          }

      # 5. Comprobar archivos y recursos
      - name: Analizar contenido descargado
        if: always()
        shell: pwsh
        run: |
          $folder = "$env:GITHUB_WORKSPACE\android-ui-es"
          $report = "$env:GITHUB_WORKSPACE\informe-recursos.txt"

          if (-not (Test-Path $folder)) {
            throw "No existe la carpeta de descarga."
          }

          $files = Get-ChildItem $folder -Recurse -File

          $extensions = @(
            ".html", ".htm", ".css", ".js",
            ".png", ".jpg", ".jpeg", ".webp",
            ".gif", ".svg", ".ico",
            ".woff", ".woff2", ".ttf", ".otf"
          )

          $lines = [System.Collections.Generic.List[string]]::new()

          $lines.Add("INFORME DE DESCARGA ANDROID UI")
          $lines.Add("Fecha: $(Get-Date)")
          $lines.Add("")

          foreach ($extension in $extensions) {
            $count = @(
              $files | Where-Object {
                $_.Extension -ieq $extension
              }
            ).Count

            $lines.Add("$extension : $count")
          }

          $totalSize = ($files | Measure-Object Length -Sum).Sum

          $lines.Add("")
          $lines.Add("Total de archivos: $($files.Count)")
          $lines.Add("Tamano total MB: $([math]::Round($totalSize / 1MB, 2))")

          $lines | Out-File $report -Encoding utf8

          $lines | ForEach-Object { Write-Host $_ }

          Copy-Item $report "$folder\informe-recursos.txt" -Force

      # 6. Publicar resultado
      - name: Crear archivo descargable
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Android-UI-Espanol
          path: |
            android-ui-es/
            webcopy.log
            informe-recursos.txt
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
