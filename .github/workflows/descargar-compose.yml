
name: Descargar curso Jetpack Compose en espanol

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  descargar:
    name: Descargar curso Jetpack Compose
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Instalar HTTrack
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y httrack
          httrack --version

      - name: Preparar carpetas
        shell: bash
        run: |
          mkdir -p jetpack-compose-curso

      - name: Comprobar acceso al curso
        shell: bash
        run: |
          URL="https://developer.android.com/courses/jetpack-compose/course?hl=es"

          echo "Comprobando acceso al curso..."

          curl -sS -L \
            --max-redirs 10 \
            -A "OpenCode-User/1.0" \
            -o pagina-prueba.html \
            -w "\nHTTP final: %{http_code}\nURL final: %{url_effective}\nTipo de contenido: %{content_type}\n" \
            "$URL"

          if ! grep -qiE '<html|<!doctype html' pagina-prueba.html; then
            echo "ERROR: No se recibio HTML."
            exit 1
          fi

          if grep -qiE 'oauth2callback|accounts\.google\.com' pagina-prueba.html; then
            echo "ERROR: Redireccion a Google OAuth."
            exit 1
          fi

          echo "Acceso correcto al curso."

      - name: Descargar curso con HTTrack
        shell: bash
        timeout-minutes: 330
        run: |
          URL="https://developer.android.com/courses/jetpack-compose/course?hl=es"
          OUTPUT="jetpack-compose-curso"

          set -o pipefail

          httrack "$URL" \
            -O "$OUTPUT" \
            --go-everywhere \
            --include-query-string \
            --user-agent "OpenCode-User/1.0" \
            --language "es-ES,es;q=0.9" \
            --verbose \
            --file-log \
            --extra-log \
            -r5 \
            "-*" \
            "+developer.android.com/courses/jetpack-compose/*" \
            "-developer.android.com/courses/jetpack-compose/*hl=*" \
            "+developer.android.com/courses/jetpack-compose/*hl=es*" \
            "+developer.android.com/courses/pathways/jetpack-compose-for-android-developers-*" \
            "-developer.android.com/courses/pathways/jetpack-compose-for-android-developers-*hl=*" \
            "+developer.android.com/courses/pathways/jetpack-compose-for-android-developers-*hl=es*" \
            "+developer.android.com/codelabs/*" \
            "+developer.android.com/develop/ui/compose/*" \
            "+developer.android.com/static/*" \
            "+www.gstatic.com/devrel-devsite/*" \
            2>&1 | tee httrack-console.log

      - name: Analizar archivos descargados
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter

          folder = Path("jetpack-compose-curso")
          report = Path("informe-recursos.txt")

          extensions = [
              ".html", ".htm", ".css", ".js",
              ".png", ".jpg", ".jpeg", ".webp",
              ".gif", ".svg", ".ico",
              ".woff", ".woff2", ".ttf", ".otf",
              ".json", ".xml", ".pdf",
              ".mp4", ".webm"
          ]

          files = [p for p in folder.rglob("*") if p.is_file()]
          counts = Counter(p.suffix.lower() for p in files)
          total_size = sum(p.stat().st_size for p in files)

          lines = [
              "INFORME DE DESCARGA JETPACK COMPOSE",
              "",
              f"Total de archivos: {len(files)}",
              f"Tamano total: {total_size / (1024 * 1024):.2f} MB",
              "",
              "RECURSOS POR EXTENSION:"
          ]

          for ext in extensions:
              lines.append(f"{ext}: {counts[ext]}")

          known = sum(counts[ext] for ext in extensions)
          lines.extend([
              f"Sin extension u otros formatos: {len(files) - known}",
              "",
              "COMPROBACION:",
              f"Carpeta principal: {folder.exists()}",
              f"HTML: {counts['.html'] + counts['.htm']}",
              f"CSS: {counts['.css']}",
              f"JavaScript: {counts['.js']}"
          ])

          report.write_text("\n".join(lines), encoding="utf-8")
          print("\n".join(lines))
          PY

      - name: Guardar curso descargado
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Jetpack-Compose-Desarrolladores-Espanol
          path: |
            jetpack-compose-curso/
            httrack-console.log
            informe-recursos.txt
            pagina-prueba.html
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
