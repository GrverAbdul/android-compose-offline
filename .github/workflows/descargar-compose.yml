
name: Diagnostico HTTrack Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Instalar HTTrack
        run: |
          sudo apt-get update
          sudo apt-get install -y httrack
          httrack --version

      - name: Comprobar acceso
        shell: bash
        run: |
          URL="https://developer.android.com/develop/ui?hl=es"
          USER_AGENT="OpenCode-User/1.0"

          curl -sS -L \
            --max-redirs 10 \
            -A "$USER_AGENT" \
            -o pagina-prueba.html \
            -w "HTTP: %{http_code}\nURL: %{url_effective}\nTipo: %{content_type}\n" \
            "$URL"

      - name: Probar descarga individual con HTTrack
        shell: bash
        timeout-minutes: 3
        run: |
          URL="https://developer.android.com/develop/ui?hl=es"
          USER_AGENT="OpenCode-User/1.0"

          mkdir -p prueba-httrack

          set -o pipefail

          httrack \
            --get "$URL" \
            -O prueba-httrack \
            --user-agent "$USER_AGENT" \
            --language "es-ES,es;q=0.9" \
            --verbose \
            --file-log \
            --extra-log \
            --debug-log \
            --debug-headers \
            2>&1 | tee httrack-diagnostico.log

      - name: Analizar resultado
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          folder = Path("prueba-httrack")
          files = [p for p in folder.rglob("*") if p.is_file()]

          total = sum(p.stat().st_size for p in files)

          print("RESULTADO DE LA PRUEBA")
          print("Archivos encontrados:", len(files))
          print(f"Tamano total: {total / 1024:.2f} KB")

          for p in files:
              print(f"{p}: {p.stat().st_size} bytes")
          PY

      - name: Guardar registros
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Diagnostico-HTTrack
          path: |
            prueba-httrack/
            pagina-prueba.html
            httrack-diagnostico.log
          if-no-files-found: warn
          retention-days: 7
