
name: Descargar Android UI en espanol

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  descargar:
    name: Descargar documentacion Android UI
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # 1. Instalar HTTrack
      - name: Instalar HTTrack
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y httrack
          httrack --version

      # 2. Preparar carpetas
      - name: Preparar carpetas
        shell: bash
        run: |
          mkdir -p android-ui-es

      # 3. Descargar documentación
      - name: Descargar Android UI en espanol
        shell: bash
        timeout-minutes: 330
        run: |
          URL="https://developer.android.com/develop/ui?hl=es"
          OUTPUT="android-ui-es"

          set -o pipefail

          httrack "$URL" \
            -O "$OUTPUT" \
            --go-everywhere \
            --include-query-string \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/139.0.0.0 Safari/537.36" \
            --language "es-ES,es;q=0.9" \
            --verbose \
            "-*" \
            "+developer.android.com/develop/ui*" \
            "-developer.android.com/develop/ui*hl=*" \
            "+developer.android.com/develop/ui*hl=es*" \
            "+developer.android.com/static/*" \
            "+www.gstatic.com/devrel-devsite/*" \
            2>&1 | tee httrack-console.log

      # 4. Analizar archivos descargados
      - name: Analizar recursos
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter

          folder = Path("android-ui-es")
          report = Path("informe-recursos.txt")

          extensions = [
              ".html", ".htm", ".css", ".js",
              ".png", ".jpg", ".jpeg", ".webp",
              ".gif", ".svg", ".ico",
              ".woff", ".woff2", ".ttf", ".otf",
              ".json", ".xml", ".pdf"
          ]

          files = [p for p in folder.rglob("*") if p.is_file()]
          counts = Counter(p.suffix.lower() for p in files)
          total_size = sum(p.stat().st_size for p in files)

          lines = [
              "INFORME DE DESCARGA ANDROID UI",
              "",
              f"Total de archivos: {len(files)}",
              f"Tamano total: {total_size / (1024 * 1024):.2f} MB",
              "",
              "RECURSOS POR EXTENSION:"
          ]

          for ext in extensions:
              lines.append(f"{ext}: {counts[ext]}")

          lines.extend([
              "",
              "COMPROBACION DE DIRECTORIOS:",
              f"Carpeta principal: {folder.exists()}",
              f"Archivos HTML: {counts['.html'] + counts['.htm']}",
              f"Archivos CSS: {counts['.css']}",
              f"Archivos JS: {counts['.js']}"
          ])

          report.write_text("\n".join(lines), encoding="utf-8")
          print("\n".join(lines))
          PY

      # 5. Publicar descarga
      - name: Guardar documentacion descargada
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Android-UI-Espanol
          path: |
            android-ui-es/
            httrack-console.log
            informe-recursos.txt
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
