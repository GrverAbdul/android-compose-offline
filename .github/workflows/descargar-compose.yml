
name: Descargar Android Compose en espanol

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  descargar:
    name: Descargar documentacion Android
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      # 1. Descargar el instalador oficial
      - name: Descargar instalador oficial de Cyotek WebCopy
        shell: pwsh
        timeout-minutes: 5
        run: |
          $url = "https://www.cyotek.com/downloads/get/setup-cyowcopy-1.9.1.872-x64.exe"
          $installer = "$env:RUNNER_TEMP\cyotek-webcopy.exe"

          Write-Host "Descargando Cyotek WebCopy..."

          Invoke-WebRequest -Uri $url -OutFile $installer

          $expected = "8b5dfdce50f95a26dea849aacc355efae459cbb2360de19fcf1a33b266f8cce0"
          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()

          if ($actual -ne $expected) {
            throw "El SHA256 del instalador no coincide."
          }

          Write-Host "Instalador descargado y verificado."

      # 2. Instalar Cyotek WebCopy
      - name: Instalar Cyotek WebCopy
        shell: pwsh
        timeout-minutes: 5
        run: |
          $installer = "$env:RUNNER_TEMP\cyotek-webcopy.exe"
          $installDir = "C:\Cyotek\WebCopy"
          $installLog = "$env:RUNNER_TEMP\cyotek-install.log"

          Write-Host "Iniciando instalacion..."

          $arguments = @(
            "/VERYSILENT"
            "/SUPPRESSMSGBOXES"
            "/NORESTART"
            "/SP-"
            "/DIR=$installDir"
            "/LOG=$installLog"
          )

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList $arguments `
            -PassThru

          Write-Host "Esperando al instalador..."

          if (-not $process.WaitForExit(180000)) {
            Write-Host "Tiempo limite superado."

            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue

            if (Test-Path $installLog) {
              Get-Content $installLog -Tail 40
            }

            throw "Instalacion detenida por timeout."
          }

          if ($process.ExitCode -ne 0) {
            if (Test-Path $installLog) {
              Get-Content $installLog -Tail 40
            }

            throw "Error de instalacion: $($process.ExitCode)"
          }

          $wcopy = Join-Path $installDir "wcopy.exe"

          if (-not (Test-Path $wcopy)) {
            Get-ChildItem $installDir -Recurse -Filter "wcopy.exe"
            throw "No se encontro wcopy.exe."
          }

          "WCOPY_PATH=$wcopy" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Cyotek WebCopy instalado correctamente."
          Write-Host "Ruta: $wcopy"

      # 3. Preparar carpeta de destino
      - name: Preparar carpetas
        shell: pwsh
        run: |
          $output = "$env:GITHUB_WORKSPACE\android-compose-es"

          New-Item -ItemType Directory -Path $output -Force |
            Out-Null

          Write-Host "Carpeta preparada: $output"

      # 4. Descargar documentacion
      - name: Descargar documentacion con WebCopy
        id: webcopy
        continue-on-error: true
        shell: pwsh
        timeout-minutes: 300
        run: |
          $url = "https://developer.android.com/develop/ui?hl=es"

          $output = "$env:GITHUB_WORKSPACE\android-compose-es"
          $log = "$env:GITHUB_WORKSPACE\webcopy.log"

          Write-Host "Iniciando descarga..."
          Write-Host "URL: $url"

          & "$env:WCOPY_PATH" `
            $url `
            /mode Domain `
            /recursive `
            /o $output `
            /header "Accept-Language: es-ES,es;q=0.9" `
            /max-concurrent-requests 4 `
            /LOG $log `
            /STATISTICS

          $exitCode = $LASTEXITCODE

          Write-Host "Codigo de salida WebCopy: $exitCode"

          "Codigo de salida WebCopy: $exitCode" |
            Out-File "$output\resultado.txt"

      # 5. Mostrar estadisticas
      - name: Mostrar estadisticas
        if: always()
        shell: pwsh
        run: |
          $folder = "$env:GITHUB_WORKSPACE\android-compose-es"

          if (Test-Path $folder) {
            $files = Get-ChildItem $folder -Recurse -File

            $count = $files.Count
            $size = ($files | Measure-Object Length -Sum).Sum

            Write-Host "Archivos descargados: $count"

            if ($size) {
              Write-Host "Tamano total: $([math]::Round($size / 1MB, 2)) MB"
            }
          }

      # 6. Publicar ZIP como Artifact
      - name: Crear archivo descargable
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Android-Compose-Espanol
          path: |
            android-compose-es/
            webcopy.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
